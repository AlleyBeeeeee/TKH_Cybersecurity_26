version: '3.8'

services:
  wiki:
    image: nginx
    container_name: hardened_wiki
    ports:
      - "8080:80"
    networks:
      - frontend
      - backend

  db:
    image: mysql
    container_name: hardened_db
    environment:
      MYSQL_ROOT_PASSWORD: SecurePassword123!
    networks:
      - backend

networks:
  frontend:
  backend:
    internal: true
